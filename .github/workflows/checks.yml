name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm --prefix source ci
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: cafenetyar-worker
          path: dist/server/
          retention-days: 7
      - run: npm run package:linux
      - uses: actions/upload-artifact@v4
        with:
          name: cafenetyar-linux
          path: dist/releases/
          retention-days: 30
